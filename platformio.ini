; ESP32-RC-Sound v3 - PlatformIO-Projekt
;
; Zwei Environments:
;   esp32dev - die echte Firmware fuer das ESP32-Board (ersetzt die bisherige
;              Arduino-IDE-basierte Entwicklung, jetzt mit fest gepinnten
;              Bibliotheksversionen statt "was gerade installiert ist").
;   native   - Host-seitige Unity-Tests fuer lib/sound_slots (siehe
;              test/test_sound_slots/). Die Tests der gemeinsamen Basis
;              liegen in src/ESP32-RC-Sound/src/RC_Common/tests/
;              (run_tests.sh, braucht nur gcc).
;
; Aufruf:
;   pio run -e esp32dev            Firmware bauen
;   pio run -e esp32dev -t upload  Firmware bauen und flashen
;   pio test -e native             Host-Tests ausfuehren

[platformio]
; Der Sketch liegt als Arduino-IDE-Ordner unter src/ESP32-RC-Sound/.
; PlatformIO wandelt .ino-Dateien nur direkt im src_dir um, daher zeigt
; src_dir auf den Sketch-Ordner (sonst fehlen setup()/loop() beim Linken).
src_dir = src/ESP32-RC-Sound

[env:esp32dev]
; Arduino-ESP32 Core 3.0.7 (ESP-IDF 5.1) ueber pioarduino, gleicher Core wie
; die Multiswitch-Firmwaren (arduino-cli esp32:esp32@3.0.7). Das offizielle
; espressif32-Paket fuer PlatformIO endet bei Core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; v6.12: OTA-Update per WLAN (siehe /api/otaupdate in WebServerManager.cpp)
; braucht zwei App-Partitionen (ota_0/ota_1). Die hat schon die Standard-
; Tabelle "default.csv" des Arduino-ESP32-Cores (2x 1,25 MB App + otadata +
; SPIFFS, entspricht "Default 4MB with spiffs" in der Arduino-IDE). Eine
; Datei "default_ota.csv" gibt es im Core nicht. Sounds/Konfiguration liegen
; ohnehin auf der SD-Karte, nicht im internen SPIFFS. Wird die Firmware
; zu gross ("app partition is too small"), auf "min_spiffs.csv" wechseln
; (2x 1,9 MB App, ebenfalls mit OTA).
board_build.partitions = default.csv
; Core 3.x baut schon mit gnu++2b, damit gehen auch die C++17-Teile
; (z. B. std::clamp in XT_I2S_Audio.cpp) ohne eigenes -std.
build_flags =
    -Wall
    -Wextra
lib_deps =
    ; Fest gepinnte Versionen statt "aktuell installiert" - siehe Review-Punkt
    ; "Testluecken": Bibliotheksversionen waren bisher nicht reproduzierbar.
    bolderflight/Bolder Flight Systems SBUS @ 8.1.4
    ; RC_Common (CRSF, UART-Rollen, S.Port, GPS, Lua-Menue, ...) liegt im
    ; Sketch unter src/RC_Common/ und wird mit dem Sketch kompiliert,
    ; braucht also keinen Eintrag hier.
    ; GPS (gps_speed.cpp) wird immer mitgebaut, daher Pflicht:
    plerup/EspSoftwareSerial @ 8.2.0
    mikalhart/TinyGPSPlus @ 1.1.0

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
test_framework = unity
; Nur die hardwareunabhaengigen lib/-Module + Tests werden hier gebaut -
; src/ (das eigentliche .ino mit Arduino/ESP32-Abhaengigkeiten) wird für
; dieses Environment bewusst NICHT mitkompiliert.
test_build_src = false
