; ESP32-RC-Sound v3 - PlatformIO-Projekt
;
; Zwei Environments:
;   esp32dev - die echte Firmware fuer das ESP32-Board (ersetzt die bisherige
;              Arduino-IDE-basierte Entwicklung, jetzt mit fest gepinnten
;              Bibliotheksversionen statt "was gerade installiert ist").
;   native   - Host-seitige Unity-Tests fuer die hardwareunabhaengigen
;              Kernfunktionen unter lib/ (siehe test/test_native/). Laeuft
;              auf dem Entwicklungsrechner, ohne ESP32-Hardware, in Sekunden.
;
; Aufruf:
;   pio run -e esp32dev            Firmware bauen
;   pio run -e esp32dev -t upload  Firmware bauen und flashen
;   pio test -e native             Host-Tests ausfuehren

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; v6.12: OTA-Update per WLAN (siehe /api/otaupdate in WebServerManager.cpp)
; braucht zwei App-Partitionen (ota_0/ota_1) statt der einen grossen
; Standard-App-Partition - "default_ota.csv" ist die im Espressif32-Platform-
; Paket mitgelieferte Standard-OTA-Tabelle (2x App + otadata + kleines
; SPIFFS). Die Firmware nutzt fuer Sounds/Konfiguration ohnehin ausschliess-
; lich die externe SD-Karte, nicht das interne SPIFFS - das kleinere interne
; Dateisystem in dieser Tabelle kostet also nichts. WICHTIG (nicht in der
; Sandbox pruefbar): nach dieser Umstellung unbedingt einmal "pio run"
; bauen und die Groessenausgabe pruefen - jede App-Partition ist jetzt nur
; noch gut halb so gross wie vorher, die aktuelle Firmware (CRSF, SBUS, GPS,
; S.Port, Webserver, Audio) muss da erst wieder reinpassen. Falls der Build
; mit "app partition is too small" fehlschlaegt, ist das ein Kompilierzeit-
; Fehler (kein Risiko fuers Geraet) - dann ggf. ungenutzte Bibliotheken/
; Features entfernen oder vorerst bei USB-Flash ohne OTA bleiben.
board_build.partitions = default_ota.csv
build_flags =
    -Wall
    -Wextra
lib_deps =
    ; Fest gepinnte Versionen statt "aktuell installiert" - siehe Review-Punkt
    ; "Testluecken": Bibliotheksversionen waren bisher nicht reproduzierbar.
    bolderflight/Bolder Flight Systems SBUS @ 8.1.4
    ; CRSF_ESP32 ist ein eigenes, nicht in den Registries gelistetes Projekt
    ; (https://github.com/Ziege-One/CRSF_ESP32) - hier als lokale Kopie in
    ; lib_extra_dirs eingebunden statt per lib_deps, da kein PlatformIO-
    ; Registry-Eintrag existiert. Fuer V5 zusaetzlich (nur bei Bedarf
    ; einkommentieren, spart Flash/RAM wenn kein GPS verbaut ist):
    ;   plerup/EspSoftwareSerial @ ^8.2.0
    ;   mikalhart/TinyGPSPlus @ ^1.1.0

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
test_framework = unity
; Nur die hardwareunabhaengigen lib/-Module + Tests werden hier gebaut -
; src/ (das eigentliche .ino mit Arduino/ESP32-Abhaengigkeiten) wird für
; dieses Environment bewusst NICHT mitkompiliert.
test_build_src = false
