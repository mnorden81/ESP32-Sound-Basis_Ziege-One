name: CI

# Gemeinsame CI aller ESP32-Module (RC_Common 1.2.0):
#   1. src/ESP32-RC-Sound/src/RC_Common/ gegen MANIFEST.sha256 pruefen (Kopie
#      unveraendert) und die Host-Tests der Basis ausfuehren (CRSF, Lua-Menue,
#      LED, Einstellungen).
#   2. Die Firmware fuer den ESP32 bauen (esp32dev, Arduino-Core 3.0.7) und
#      das Image hochladen (firmware.bin = OTA-Update).
#   3. Die projekteigenen Host-Tests (native/Unity, test/test_sound_slots).

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  rc-common:
    name: RC_Common pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Kopie unveraendert (MANIFEST.sha256)
        run: cd src/ESP32-RC-Sound/src/RC_Common && sha256sum -c --quiet MANIFEST.sha256
      - name: Host-Tests
        run: sh src/ESP32-RC-Sound/src/RC_Common/tests/run_tests.sh

  build-firmware:
    name: Build ESP32 firmware (esp32dev)
    needs: rc-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build esp32dev environment
        run: pio run -e esp32dev

      - name: Firmware hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-RC-Sound-firmware
          path: .pio/build/esp32dev/firmware.bin

  host-tests:
    name: Host tests (native/Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native
